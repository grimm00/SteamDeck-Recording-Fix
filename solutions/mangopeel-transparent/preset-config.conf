# MangoPeel Recording Fix Preset Configuration
# This configuration creates a transparent overlay to prevent recording choppiness

# Enable MangoHud overlay system
control=mangohud

# Integrate with Steam overlay system
mangoapp_steam

# FSR and NIS sharpness settings (Steam Deck specific)
fsr_steam_sharpness=5
nis_steam_sharpness=10

# Make overlay completely invisible
no_display
alpha=0.0
background_alpha=0.0

# Additional settings for stability
fps_limit=0
vsync=0
fullscreen=1
